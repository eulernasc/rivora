name: RIVORA confirmation bridge

on:
  repository_dispatch:
    types: [rivora_confirmation]

permissions:
  contents: read
concurrency:
  group: rivora-confirmation-bridge
  cancel-in-progress: false

jobs:
  update-confirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply confirmation to Firestore
        if: ${{ !github.event.client_payload.requestId }}
        run: node scripts/rivora-bridge.mjs
        env:
          RIVORA_BRIDGE_EMAIL: ${{ secrets.RIVORA_BRIDGE_EMAIL }}
          RIVORA_BRIDGE_PASSWORD: ${{ secrets.RIVORA_BRIDGE_PASSWORD }}
      - name: Apply validated Teams response to Firestore
        if: ${{ github.event.client_payload.requestId }}
        run: node scripts/rivora-teams.mjs respond
        env:
          RIVORA_BRIDGE_EMAIL: ${{ secrets.RIVORA_BRIDGE_EMAIL }}
          RIVORA_BRIDGE_PASSWORD: ${{ secrets.RIVORA_BRIDGE_PASSWORD }}
